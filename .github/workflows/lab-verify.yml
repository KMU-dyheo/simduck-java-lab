name: 실습 목표 검증

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'checkpoint/**'
      - 'work/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 자바 코드와 단계 목표 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 자바 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 실습 목표 검사
        shell: bash
        run: bash ./verify.sh
